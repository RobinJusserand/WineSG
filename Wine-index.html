<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bacchic Wine — Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inconsolata:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --cream:    #F5F0E8;
    --parchment:#EDE6D6;
    --ink:      #1A1510;
    --ink-mid:  #3D3328;
    --ink-faint:#7A6E60;
    --gold:     #B8952A;
    --gold-lt:  #D4AF54;
    --wine:     #6B1F2A;
    --wine-lt:  #8C2D3B;
    --sage:     #4A5E48;
    --border:   rgba(26,21,16,0.12);
    --border-md:rgba(26,21,16,0.22);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'Cormorant Garamond', Georgia, serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Grain overlay ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 999; opacity: 0.6;
  }

  /* ── Header ── */
  header {
    border-bottom: 0.5px solid var(--border-md);
    padding: 28px 40px 22px;
    display: flex; align-items: flex-end; justify-content: space-between;
    background: var(--parchment);
  }
  .logo-block { display: flex; flex-direction: column; gap: 2px; }
  .logo-main {
    font-size: 32px; font-weight: 300; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--ink);
    font-style: italic;
  }
  .logo-sub {
    font-family: 'Inconsolata', monospace;
    font-size: 10px; letter-spacing: 0.22em; color: var(--ink-faint);
    text-transform: uppercase;
  }
  .header-meta {
    font-family: 'Inconsolata', monospace;
    font-size: 10px; color: var(--ink-faint); text-align: right; line-height: 1.8;
  }
  .gold-rule { width: 32px; height: 1px; background: var(--gold); margin: 4px 0 4px auto; }

  /* ── Room tabs ── */
  .room-nav {
    display: flex; gap: 0;
    border-bottom: 0.5px solid var(--border-md);
    background: var(--parchment);
    padding: 0 40px;
  }
  .room-tab {
    font-family: 'Inconsolata', monospace;
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    padding: 12px 20px; cursor: pointer; color: var(--ink-faint);
    border-bottom: 2px solid transparent; transition: all 0.2s;
    background: none; border-top: none; border-left: none; border-right: none;
  }
  .room-tab:hover { color: var(--ink); }
  .room-tab.active { color: var(--gold); border-bottom-color: var(--gold); }
  .room-tab.locked { color: var(--border-md); cursor: not-allowed; }

  /* ── Main layout ── */
  .main { display: grid; grid-template-columns: 1fr 340px; min-height: calc(100vh - 120px); }

  /* ── Map pane ── */
  .map-pane { padding: 32px 40px; border-right: 0.5px solid var(--border); }
  .pane-label {
    font-family: 'Inconsolata', monospace;
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink-faint); margin-bottom: 20px;
    display: flex; align-items: center; gap: 12px;
  }
  .pane-label::after { content: ''; flex: 1; height: 0.5px; background: var(--border); }

  .room-svg { width: 100%; display: block; }

  /* Zone interactivity */
  .zone-btn { cursor: pointer; transition: opacity 0.15s; }
  .zone-btn rect, .zone-btn path { transition: opacity 0.15s; }
  .zone-btn:hover rect { opacity: 0.75; }
  .zone-btn.active rect { stroke-width: 2px; opacity: 1; }
  .zone-btn.populated rect { filter: drop-shadow(0 1px 4px rgba(107,31,42,0.18)); }

  /* ── Detail pane ── */
  .detail-pane {
    padding: 32px 28px;
    background: var(--parchment);
    overflow-y: auto;
    max-height: calc(100vh - 120px);
    position: sticky; top: 0;
  }

  .detail-empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; gap: 12px; opacity: 0.4; padding-top: 80px;
  }
  .detail-empty .glyph { font-size: 40px; }
  .detail-empty p { font-size: 14px; font-style: italic; color: var(--ink-faint); text-align: center; }

  .detail-header { margin-bottom: 20px; }
  .detail-zone-tag {
    font-family: 'Inconsolata', monospace;
    font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 6px;
  }
  .detail-zone-name { font-size: 22px; font-weight: 300; line-height: 1.2; margin-bottom: 4px; }
  .detail-zone-desc { font-size: 13px; color: var(--ink-faint); font-style: italic; }
  .detail-rule { height: 0.5px; background: var(--border-md); margin: 16px 0; }

  /* Capacity bar */
  .cap-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .cap-track { flex: 1; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .cap-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }
  .cap-fill.full { background: var(--wine); }
  .cap-fill.empty { background: var(--sage); width: 0%; }
  .cap-text { font-family: 'Inconsolata', monospace; font-size: 10px; color: var(--ink-faint); white-space: nowrap; }

  /* Bottle list */
  .bottle-list { display: flex; flex-direction: column; gap: 0; }
  .bottle-item {
    display: grid; grid-template-columns: 24px 1fr auto;
    align-items: center; gap: 10px;
    padding: 9px 0; border-bottom: 0.5px solid var(--border);
    animation: fadeIn 0.2s ease both;
  }
  .bottle-item:last-child { border-bottom: none; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .b-num { font-family: 'Inconsolata', monospace; font-size: 10px; color: var(--ink-faint); text-align: right; }
  .b-info { display: flex; flex-direction: column; gap: 1px; }
  .b-vintage { font-size: 15px; font-weight: 500; color: var(--ink); }
  .b-cuvee { font-size: 11px; color: var(--ink-faint); font-style: italic; }
  .b-price {
    font-family: 'Inconsolata', monospace; font-size: 12px;
    color: var(--ink-mid); white-space: nowrap;
  }
  .b-price.pending { color: var(--border-md); font-style: italic; }

  /* Zone total */
  .zone-total {
    margin-top: 16px; padding: 12px 14px;
    border: 0.5px solid var(--border-md); border-radius: 2px;
    background: rgba(26,21,16,0.03);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .zt-label { font-size: 12px; color: var(--ink-faint); font-style: italic; }
  .zt-value { font-family: 'Inconsolata', monospace; font-size: 16px; color: var(--ink); }

  /* Alert */
  .alert {
    margin-top: 12px; padding: 10px 12px;
    border-left: 2px solid var(--gold);
    background: rgba(184,149,42,0.07);
    font-size: 12px; color: var(--ink-mid); line-height: 1.6;
  }
  .alert b { color: var(--gold); font-weight: 500; }

  /* Empty zone state */
  .empty-state { font-size: 14px; color: var(--ink-faint); font-style: italic; padding: 12px 0; }

  /* Stats footer */
  .stats-bar {
    display: flex; gap: 0;
    border-top: 0.5px solid var(--border-md);
    background: var(--parchment);
  }
  .stat {
    flex: 1; padding: 14px 24px; border-right: 0.5px solid var(--border);
    display: flex; flex-direction: column; gap: 3px;
  }
  .stat:last-child { border-right: none; }
  .stat-v { font-family: 'Inconsolata', monospace; font-size: 20px; color: var(--ink); }
  .stat-l { font-family: 'Inconsolata', monospace; font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink-faint); }

  /* Scrollbar */
  .detail-pane::-webkit-scrollbar { width: 3px; }
  .detail-pane::-webkit-scrollbar-track { background: transparent; }
  .detail-pane::-webkit-scrollbar-thumb { background: var(--border-md); border-radius: 2px; }

  @media (max-width: 768px) {
    header { padding: 20px; }
    .room-nav { padding: 0 20px; }
    .main { grid-template-columns: 1fr; }
    .map-pane { padding: 20px; }
    .detail-pane { position: static; max-height: none; border-top: 0.5px solid var(--border); }
    .stats-bar { flex-wrap: wrap; }
  }
</style>
</head>

const empty  = document.getElementById('detail-empty');
const content= document.getElementById('detail-content');
const dTag   = document.getElementById('d-tag');
const dName  = document.getElementById('d-name');
const dDesc  = document.getElementById('d-desc');
const dFill  = document.getElementById('d-capfill');
const dCap   = document.getElementById('d-captext');
const dBot   = document.getElementById('d-bottles');
const dTot   = document.getElementById('d-total');
const dAle   = document.getElementById('d-alerts');

function showZone(id) {
  const z = DATA[id];
  if (!z) return;

  empty.style.display  = 'none';
  content.style.display= 'block';

  dTag.textContent  = z.tag;
  dName.textContent = z.name;
  dDesc.textContent = z.desc;

  // Capacity bar
  if (z.cap) {
    const pct = Math.round((z.total / z.cap) * 100);
    dFill.style.width = pct + '%';
    dFill.className   = 'cap-fill ' + (pct >= 100 ? 'full' : 'empty');
    dCap.textContent  = z.total + ' / ' + z.cap + ' bottles';
  } else {
    dFill.style.width = '0%';
    dCap.textContent  = z.total > 0 ? z.total + ' bottles' : 'capacity TBD';
  }

  // Bottle list
  if (z.bottles.length === 0) {
    dBot.innerHTML = '<div class="empty-state">No bottles assigned yet.</div>';
  } else {
    let idx = 1;
    dBot.innerHTML = z.bottles.map(function(b) {
      const start = idx;
      idx += b.qty;
      const numStr = b.qty > 1 ? (start + '–' + (idx-1)) : start;
      const priceStr = b.price
        ? ('$' + b.price.toLocaleString() + (b.qty > 1 ? ' ea.' : ''))
        : '—';
      return '<div class="bottle-item" style="animation-delay:' + (start * 0.03) + 's">'
        + '<div class="b-num">' + numStr + '</div>'
        + '<div class="b-info">'
        +   '<div class="b-vintage">Clos Rougeard ' + b.vintage + (b.qty > 1 ? ' <span style="font-size:11px;color:var(--ink-faint)">×' + b.qty + '</span>' : '') + '</div>'
        +   '<div class="b-cuvee">"' + b.cuvee + '"</div>'
        + '</div>'
        + '<div class="b-price' + (b.price ? '' : ' pending') + '">' + priceStr + '</div>'
        + '</div>';
    }).join('');
  }

  // Zone total
  if (z.zoneTotal > 0) {
    dTot.innerHTML = '<div class="zone-total"><span class="zt-label">Zone inventory value</span><span class="zt-value">$' + z.zoneTotal.toLocaleString() + '</span></div>';
  } else {
    dTot.innerHTML = '';
  }

  // Alerts
  if (z.alerts && z.alerts.length) {
    dAle.innerHTML = z.alerts.map(function(a) {
      return '<div class="alert">' + a.text + '</div>';
    }).join('');
  } else {
    dAle.innerHTML = '';
  }
}

document.querySelectorAll('.zone-btn').forEach(function(g) {
  g.addEventListener('click', function() {
    document.querySelectorAll('.zone-btn').forEach(function(x){ x.classList.remove('active'); });
    g.classList.add('active');
    showZone(g.id.replace('zb-', ''));
  });
  g.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') g.click();
  });
});
</script>
